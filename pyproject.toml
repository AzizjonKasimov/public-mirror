[project]
name = "public-mirror"
version = "0.1.0"
description = "Publish a public copy of a private git repo, without its private files and private lines."
readme = "README.md"
license = "MIT"
authors = [{ name = "Azizjon Kasimov" }]
requires-python = ">=3.11"
dependencies = []

[project.urls]
Homepage = "https://github.com/AzizjonKasimov/public-mirror"

[project.optional-dependencies]
pdf = ["pypdf>=4"]

[project.scripts]
public-mirror = "public_mirror.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pypdf>=4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["public_mirror"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
